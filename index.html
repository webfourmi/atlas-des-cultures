/* Édition illustrée, 2026 : cartes, lectures enrichies et grande accessibilité */
.art{padding:0;background:var(--ink);height:176px;display:block}
.art::before,.art::after{display:none}
.art img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
.destination:hover .art img{transform:scale(1.035)}
.flag-photo{position:absolute;right:14px;top:14px;font-size:1.4rem;background:#fffef4ef;padding:5px 9px;border-radius:10px;box-shadow:0 3px 12px #0002}
.destination .art{position:relative}
.destfoot{gap:10px;flex-wrap:wrap}.dest-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.dest-actions button{flex:1;min-width:100px;border-radius:10px;border:1px solid #cbd8d1;padding:10px 8px;background:#f4f8f2;color:var(--ink);font-size:.79rem;font-weight:800}
.dest-actions .quiz{background:var(--ink);color:white;border-color:var(--ink)}
.read-tag{display:inline-flex;align-items:center;gap:4px;color:#2e8570;background:#e4f3eb;border-radius:14px;padding:3px 8px;font-size:.7rem}
.read-hero{position:relative;display:grid;grid-template-columns:1.1fr .9fr;min-height:335px;border-radius:23px;overflow:hidden;background:#153641;color:white;box-shadow:var(--shadow)}
.read-hero-text{padding:39px 39px 33px;display:flex;flex-direction:column;justify-content:center}
.read-hero h1{font:700 clamp(2.05rem,4vw,3.5rem)/1.05 Georgia,serif;margin:11px 0 13px;letter-spacing:-.03em}
.read-hero p{color:#e0e9e0;line-height:1.75;margin:0 0 20px;font-size:1.02rem}
.read-hero-image{min-height:280px;overflow:hidden;position:relative}
.read-hero-image img{height:100%;width:100%;object-fit:cover;display:block}
.read-hero-image .illustration-note{position:absolute;bottom:11px;right:11px;background:#102b37d9;color:white;font-size:.67rem;padding:5px 9px;border-radius:7px}
.read-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;color:#d7ded3;font-weight:700;font-size:.77rem}
.read-meta span{border:1px solid #ffffff38;border-radius:14px;padding:4px 9px}
.read-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(245px,.76fr);align-items:start;gap:19px;margin-top:20px}
.read-article{background:var(--paper);border:1px solid #e7e1d6;border-radius:19px;padding:clamp(19px,3vw,38px);box-shadow:0 7px 22px #102b370a}
.read-article .overline{color:#2f8178;font-size:.77rem;letter-spacing:.13em;font-weight:900;text-transform:uppercase}
.read-article h2{font:700 clamp(1.58rem,3vw,2.15rem) Georgia,serif;margin:8px 0 12px}
.read-article section+section{border-top:1px solid #e5e3d7;padding-top:23px;margin-top:25px}
.read-article h3{font:700 1.34rem Georgia,serif;margin:0 0 8px}
.read-article p{color:#425b5d;font-size:1rem;line-height:1.85;margin:0}
.read-aside{display:grid;gap:16px}
.aside-sheet{background:#eef4ed;border:1px solid #dce7da;border-radius:17px;padding:20px}
.aside-sheet.gold{background:#fcf3df;border-color:#efddb9}
.aside-sheet h3{font:700 1.12rem Georgia,serif;margin:0 0 11px}
.aside-sheet p{margin:0;color:#475e5f;line-height:1.72;font-size:.87rem}
.aside-sheet .pillset{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
.aside-sheet .pillset span{padding:5px 8px;background:#fffdf4;color:#476863;font-size:.72rem;border-radius:12px;font-weight:750}
.read-bottom{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.source-card{background:#fbfaf5;border:1px solid #dedfd3;padding:17px 20px;border-radius:14px;font-size:.82rem;margin-top:25px;color:#50666a}
.source-card p{margin:5px 0 0;line-height:1.5}
.fiche-teaser{background:#f6e8d1;border:1px solid #ead2ac;padding:12px;border-radius:13px;margin-top:19px}
.fiche-teaser p{font-size:.87rem;margin:0 0 10px;color:#6b5434;line-height:1.6}
.fiche-teaser button{border:0;background:#154e56;color:white;padding:9px 12px;border-radius:9px;font-weight:800}
.library-card{overflow:hidden;padding:0!important;display:flex;flex-direction:column}
.lib-cover{height:165px;width:100%;object-fit:cover;display:block}
.lib-copy{padding:20px;flex:1;display:flex;flex-direction:column}
.lib-copy p{flex:1}
.lib-copy .actions-row{gap:7px;flex-wrap:wrap}
.captioned{font-size:.72rem;color:#667871;margin:8px 2px 0}
.feature-photo{width:100%;height:100%;object-fit:cover}
@media(max-width:730px){.read-hero{grid-template-columns:1fr}.read-hero-image{order:-1;min-height:220px;max-height:250px}.read-hero-text{padding:23px}.read-grid{grid-template-columns:1fr}.read-aside{grid-template-columns:1fr 1fr}.read-article{padding:22px}}
@media(max-width:500px){.art{height:165px}.read-aside{grid-template-columns:1fr}.read-meta{font-size:.7rem}.read-hero h1{font-size:2.1rem}.read-hero p{font-size:.95rem}.dest-actions button{min-width:100px}}


/* PWA & sauvegardes */
.nav #nav-settings{white-space:nowrap}

.settings-hero{padding:28px;display:flex;gap:20px;align-items:center;border-radius:23px;color:white;background:linear-gradient(115deg,#14333e,#226968);margin-bottom:18px}
.settings-hero img{width:90px;height:90px;border-radius:22px}.settings-hero h1{font:700 clamp(1.9rem,4vw,3rem) Georgia,serif;margin:6px 0}.settings-hero p{color:#dceae4;margin:0}

.settings-card{background:var(--paper);border:1px solid #e4e3d8;border-radius:18px;padding:24px}
.settings-card h2{font:700 1.4rem Georgia,serif;margin:0 0 11px}.settings-card p{font-size:.93rem;line-height:1.75;color:#516468;margin:0 0 15px}
.settings-card .btn{margin:4px 5px 7px 0;font-size:.82rem}.settings-hint{padding:13px;background:#edf4ec;border-radius:12px;color:#385b57;font-size:.86rem;line-height:1.6}
.settings-stats{display:flex;gap:10px;flex-wrap:wrap;font-size:.84rem;margin-bottom:14px;color:#2c6359;font-weight:800}
.badge-ver{display:inline-flex;border-radius:16px;padding:4px 10px;background:#e8f6e8;color:#2c645b;font-size:.77rem;font-weight:800}
@media(max-width:730px){.settings-grid{grid-template-columns:1fr}.settings-hero{padding:22px}.settings-hero img{width:68px;height:68px}.nav #install-header{padding:7px 10px}}

.recipe-sheet{background:#fffdf7;color:#193842;border-radius:18px;padding:32px;max-width:980px;margin:auto;overflow-wrap:anywhere}
.recipe-sheet h1{font-size:2.2rem}.recipe-sheet h2{font-size:1.3rem;margin-top:24px}.recipe-sheet li{margin-bottom:9px;line-height:1.6}.recipe-sheet p{line-height:1.6}.recipe-sheet a{color:#235d66;text-decoration:underline}
.recipe-meta{display:flex;gap:12px;flex-wrap:wrap;border-block:1px solid #ccc;padding:14px 0}.recipe-columns{display:grid;grid-template-columns:1fr 1.5fr;gap:24px}.recipe-sources{font-size:.85rem}.print-url{display:none}
@media(max-width:650px){.recipe-sheet{padding:20px}.recipe-sheet h1{font-size:1.7rem}.recipe-columns{grid-template-columns:1fr;gap:0}}
@page{size:A4 portrait;margin:14mm}
@media print{
 body.recipe-print{background:white!important;color:black!important;margin:0!important;font:10pt/1.35 Georgia,serif}
 body.recipe-print>*:not(main){display:none!important}
 body.recipe-print main{display:block!important;width:auto!important;max-width:none!important;margin:0!important;padding:0!important}
 .recipe-toolbar{display:none!important}.recipe-sheet{padding:0!important;margin:0!important;max-width:none!important;background:white!important;color:black!important;border:0!important;border-radius:0!important;box-shadow:none!important}
 .recipe-sheet h1{font-size:21pt;margin:8pt 0}.recipe-sheet h2{font-size:12pt;margin:10pt 0 5pt}.recipe-sheet p,.recipe-sheet li{line-height:1.35;margin:4pt 0}.recipe-meta{padding:7pt 0;gap:8pt;font-size:9pt}
 .recipe-columns{display:grid;grid-template-columns:1fr 1.5fr;gap:18pt}.recipe-sheet li{break-inside:avoid}.recipe-sheet h2{break-after:avoid}.recipe-sources{font-size:7.5pt}.print-url{display:inline;overflow-wrap:anywhere}.recipe-sheet a{color:black;text-decoration:none}

const GUIDES={"japon":{"year":"2013","place":"Dans les foyers et les communautés du Japon","lead":"Un repas est parfois un calendrier, un langage symbolique et un acte de transmission. Le washoku raconte la façon dont on choisit, prépare et partage les aliments.","sections":[["🌿 Bien plus qu’une cuisine","Le mot « washoku » ne désigne pas un menu obligatoire ni une recette unique. L’UNESCO décrit un ensemble de savoirs : cultiver ou recueillir des produits, les transformer, les cuisiner et les manger ensemble. L’attention portée aux ressources naturelles et au rythme des saisons en fait aussi une manière de penser le lien entre nourriture et environnement."],["🍡 Le Nouvel An à table","Les célébrations du Nouvel An rendent ces pratiques particulièrement visibles. On prépare des aliments choisis pour leur sens symbolique, on confectionne parfois des gâteaux de riz mochi et on dispose les mets sur une vaisselle de fête. Préparatifs, présentation et repas partagé font partie de l’événement autant que les saveurs."],["👪 La transmission en pratique","Dans les maisons, on apprend en observant et en participant à la préparation des repas. Enseignants, associations et cours de cuisine complètent cet apprentissage familial. Les pratiques diffèrent selon les régions, les générations et les familles : il n’existe pas une assiette capable de résumer tout le Japon."],["🔎 Aujourd’hui, que regarde-t-on ?","Au marché, dans un repas quotidien ou lors d’une fête, repère comment la saison influence les ingrédients. La même tradition peut s’adapter aux modes de vie contemporains tout en conservant ses savoir-faire et ses valeurs de partage."]],"key":"Ce sont les pratiques alimentaires et sociales du washoku, pas un plat isolé, qui figurent sur la liste UNESCO.","observe":"Observe le repas illustré : la diversité des petits plats évoque le soin de la présentation, mais il ne s’agit pas d’une reconstitution historique.","words":["Saisons","Repas partagé","Nouvel An"]},"coree":{"year":"2013","place":"Dans les foyers et les communautés de Corée du Sud","lead":"Préparer une réserve pour l’hiver devient un travail collectif où l’on échange recettes, gestes et portions de kimchi.","sections":[["🥬 Une préparation en plusieurs saisons","Le kimjang est lié à un cycle annuel. Les foyers préparent ou se procurent certains ingrédients au printemps et en été ; en fin d’automne vient souvent la grande préparation collective. Des légumes sont salés puis assaisonnés avant fermentation. Les méthodes changent d’une région et d’une famille à l’autre."],["🧂 Pourquoi tant de monde ?","Préparer de grandes quantités demande du temps et des mains. Parents, amis et voisins peuvent travailler ensemble, partager des conseils et répartir les réserves. Le kimjang permet aussi de penser à ceux qui ne peuvent pas faire leur propre préparation."],["🏠 Une mémoire de famille","Les quantités, les mélanges d’épices ou la place des produits de la mer peuvent varier. Ces différences ne sont pas des erreurs : ce sont des héritages locaux. Pour l’UNESCO, l’entraide et le lien entre générations comptent autant que le résultat dans le bocal."],["🌱 Le kimchi et le kimjang, est-ce pareil ?","Le kimchi désigne des préparations de légumes assaisonnés et conservés ; le kimjang désigne une pratique de préparation et de partage. On peut manger du kimchi tout au long de l’année sans participer à une grande séance collective de kimjang."]],"key":"La tradition UNESCO porte sur « préparer ET partager » le kimchi, pas seulement sur la recette.","observe":"L’illustration montre un atelier collectif. Cherche les gestes qui facilitent la coopération.","words":["Fermentation","Entraide","Automne"]},"vietnam":{"year":"2009","place":"Bắc Ninh et Bắc Giang, dans le nord du Viet Nam","lead":"Deux voix appellent, d’autres répondent. À travers les chansons Quan Họ, les villages entretiennent des liens, des souvenirs et une esthétique de la rencontre.","sections":[["🎼 Une conversation chantée","Dans la forme documentée par l’UNESCO, deux femmes d’un village chantent des couplets auxquels répondent deux hommes d’un autre village, sur des mélodies apparentées, mais avec des paroles différentes. Le répertoire comprend des centaines de textes et de nombreuses variations mélodiques : le dialogue demande autant d’écoute que de virtuosité."],["🎩 Des habits et des signes","Les chanteuses portent traditionnellement de grands chapeaux ronds et des écharpes ; les chanteurs peuvent porter tunique, turban et parapluie. Ces accessoires rendent la rencontre visuellement reconnaissable. Ils ne résument toutefois pas la complexité musicale des prestations."],["🤝 Des relations entre villages","Les chants accompagnent fêtes, rituels et réunions amicales. Des villages jumelés consolident leurs relations grâce à cette pratique. Les thèmes évoquent la joie des retrouvailles ou la peine de la séparation ; une coutume mentionnée dans la documentation interdit le mariage entre partenaires de chant."],["🗣️ Une musique qui s’apprend ensemble","La transmission passe par l’observation et l’apprentissage de techniques vocales. Ces réunions sont aussi des occasions de politesse, d’hospitalité et de négociation des relations sociales. Écouter un Quan Họ, c’est entendre un échange, pas seulement une jolie mélodie."]],"key":"Le chant est une forme de dialogue social entre communautés, autant qu’une création musicale.","observe":"Regarde le grand chapeau plat de la chanteuse : c’est un élément traditionnel bien connu des tenues Quan Họ.","words":["Chant alterné","Villages liés","Poésie"]},"indonesie":{"year":"2009","place":"Dans de nombreuses régions d’Indonésie","lead":"Une étoffe raconte une histoire à travers ses couleurs, ses motifs et les couches successives de cire et de teinture.","sections":[["🖋️ La cire comme dessin invisible","Sur du coton ou de la soie, l’artisan applique des points et des lignes de cire chaude pour empêcher le colorant de pénétrer certaines zones. L’étoffe est ensuite teinte ; on peut ôter la cire et répéter les opérations pour composer plusieurs couleurs. Le motif final naît de cette succession de protections et de bains."],["🌺 Des motifs qui voyagent","Le batik indonésien rassemble une grande variété de dessins. L’UNESCO mentionne notamment des influences issues de la calligraphie arabe, de fleurs européennes, de représentations chinoises ou de motifs indiens et persans. Les formes ont des histoires et des significations différentes selon les lieux."],["👶 De la naissance aux cérémonies","Le tissu peut accompagner les moments marquants de l’existence : portage des bébés, vêtements de tous les jours, mariage, cérémonies et rites funéraires. Un tissu n’est donc pas seulement une décoration ; le choix du motif et de l’occasion peut être porteur de sens."],["🧵 À retenir","Le batik est à la fois une technique et un ensemble de traditions liées au vêtement. Il existe plusieurs façons de le produire et de le porter. Évite de considérer tous les motifs comme interchangeables ou propres à toute l’Indonésie."]],"key":"La cire protège le tissu avant la teinture ; elle ne sert pas simplement à décorer la surface.","observe":"Sur l’illustration, repère l’outil qui permet de guider la cire et les zones où le tissu est encore clair.","words":["Cire","Teinture","Symboles"]},"inde":{"year":"2016","place":"Inde, puis diffusion internationale","lead":"Bien avant de devenir une pratique de studio, le yoga réunissait attention, discipline du souffle, postures et réflexion philosophique.","sections":[["🪷 Corps, souffle et pensée","Pour l’UNESCO, le yoga n’est pas un simple catalogue de positions. Il englobe postures, respiration contrôlée, méditation, récitations et d’autres techniques. Ces pratiques s’inscrivent dans des visions diverses de l’harmonie entre corps, esprit et vie intérieure."],["📜 Un long héritage","Des textes, des lignées d’enseignement et des communautés ont transmis les savoirs associés au yoga. Le modèle guru-shishya désigne une relation d’apprentissage entre maître et élève. Les modalités et les écoles de yoga ne sont cependant pas uniformes."],["🏡 Comment apprend-on aujourd’hui ?","Aux transmissions traditionnelles se sont ajoutés ashrams, écoles, universités, centres communautaires et ressources numériques. Cette ouverture a rendu certaines techniques très accessibles, mais la version sportive contemporaine ne reflète pas toute l’étendue de la tradition."],["🔎 Une nuance essentielle","L’inscription UNESCO de 2016 reconnaît une pratique culturelle vivante et les communautés qui la transmettent. Ce n’est ni un label accordé à une méthode commerciale ni une validation médicale de toutes les promesses associées au yoga."]],"key":"L’inscription UNESCO ne se limite pas aux asanas : elle comprend des dimensions mentales, spirituelles et philosophiques.","observe":"L’illustration met l’accent sur des postures ; demande-toi quels aspects du yoga restent invisibles dans une image.","words":["Souffle","Transmission","Philosophie"]},"vanuatu":{"year":"2008","place":"Îles du centre et du nord du Vanuatu","lead":"Sur le sable, un dessin peut être à la fois une image, une histoire, un rappel mnémotechnique et une forme de communication.","sections":[["🌀 Le geste du dessinateur","Les motifs sont tracés directement au sol, dans du sable, de la cendre volcanique ou de l’argile. Avec un doigt, l’artiste suit souvent une ligne sinueuse continue autour d’une grille imaginée. Le résultat peut être symétrique et d’une grande complexité."],["🗣️ Une écriture sans alphabet","L’UNESCO décrit ces dessins comme une forme d’« écriture » multifonction. Ils peuvent conserver le souvenir de récits, de mythes, de relations de parenté ou de savoir-faire. Ils se sont développés dans un archipel marqué par une forte diversité linguistique."],["🧠 Le sens ne se voit pas toujours","Un maître dessinateur ne connaît pas seulement des figures géométriques : il sait aussi les interpréter, parfois avec des chants et des histoires. Un même motif peut avoir plusieurs couches de sens. Une copie graphique ne transmet donc pas nécessairement toute la connaissance."],["⚠️ Préserver le contexte","La présentation de dessins aux visiteurs peut favoriser leur visibilité, mais risque de les réduire à de simples ornements. Les efforts de sauvegarde cherchent aussi à transmettre les récits, les usages et la parole des détenteurs de la tradition."]],"key":"Comprendre le dessin suppose souvent de connaître le récit et le savoir qui l’accompagnent.","observe":"Suis des yeux la ligne dans le sable : elle suggère la continuité du geste, mais le motif représenté est une évocation artistique.","words":["Ligne continue","Mémoire","Récit"]},"turquie":{"year":"2013","place":"Türkiye, cafés et foyers","lead":"Une tasse de café concentré, un verre d’eau, parfois une conversation qui dure : le rite commence avant la première gorgée.","sections":[["☕ La préparation","On moud très finement les grains torréfiés, puis on les fait chauffer lentement avec de l’eau, et éventuellement du sucre, dans un petit récipient. La mousse est recherchée et la boisson est versée dans de petites tasses sans filtration à papier."],["🪑 Un espace de rencontre","Dans les cafés comme à la maison, le service du café crée une occasion de discuter, d’échanger des nouvelles et de recevoir des invités. L’UNESCO souligne l’importance de l’hospitalité et de l’amitié autour de cette tradition."],["💍 Les occasions particulières","Le café intervient aussi dans certaines cérémonies et fêtes, dont les fiançailles. Les pratiques se transmettent fréquemment par observation dans les familles. Chaque service n’a pas pour autant le caractère d’un rituel solennel."],["🔮 Le fond de la tasse","Après dégustation, le marc restant peut être interprété pour une divination ludique. C’est une tradition sociale et symbolique, pas une technique prouvée pour prédire l’avenir. Le café inspire également récits, chansons et littérature."]],"key":"L’hospitalité et la conversation font partie du patrimoine autant que la méthode de préparation.","observe":"Sur l’image, repère la petite cafetière et la tasse ; le verre d’eau est aussi un compagnon traditionnel du service.","words":["Mouture fine","Mousse","Hospitalité"]},"georgie":{"year":"2013","place":"Villages et familles de Géorgie","lead":"Une grande jarre enfouie dans la terre relie le travail du potier, la vigne, les vendanges et la mémoire familiale.","sections":[["🏺 Qu’est-ce qu’un kvevri ?","C’est un grand récipient ovoïde de terre cuite destiné à la vinification, à la conservation et au vieillissement du vin. Il est traditionnellement enterré dans le sol pour contribuer à la stabilité des conditions de fermentation."],["🍇 Le processus décrit par l’UNESCO","Les raisins sont pressés, puis le jus et divers éléments du raisin, comme les peaux et pépins, peuvent être placés dans le kvevri. Le récipient est fermé et conservé en terre pendant plusieurs mois. La méthode dépend des connaissances de la vigne et de la fabrication des jarres."],["👨‍👩‍👧 Une affaire collective","Vendanges et vinification rassemblent parfois famille, proches et voisins. Les enfants découvrent la taille de la vigne, les matériaux, la poterie et les gestes en observant les aînés. Le lieu de conservation, le marani, a dans certaines familles une importante valeur symbolique."],["🎶 Au-delà du vin","Les vignes et le vin occupent une place dans les chants et les traditions orales géorgiennes, ainsi que dans des événements civils ou religieux. L’UNESCO protège ici un savoir-faire et des relations sociales, pas une marque ou une appellation commerciale."]],"key":"Le kvevri est une jarre de terre cuite utilisée pour produire le vin, pas simplement pour le servir.","observe":"L’image montre des récipients enterrés : essaie d’imaginer toutes les étapes nécessaires pour les fabriquer et les utiliser.","words":["Poterie","Vendanges","Famille"]},"maroc":{"year":"2008 (proclamé en 2001)","place":"Place Jemaa el-Fna, Marrakech","lead":"Une place urbaine peut devenir une scène à ciel ouvert où histoires, musiques, gestes et rencontres se renouvellent chaque soir.","sections":[["🌆 Un lieu vivant","Jemaa el-Fna se trouve à l’entrée de la médina de Marrakech. Depuis longtemps, elle accueille échanges commerciaux et spectacles populaires. La place change d’ambiance au fil de la journée ; ce sont surtout les activités et leurs porteurs qui constituent le patrimoine immatériel."],["📖 L’art de captiver un public","Conteurs, poètes, musiciens et autres artistes y font vivre la parole et la performance. Certains récits anciens sont réadaptés ou improvisés pour les auditeurs du moment. La voix, les gestes et les réactions du public façonnent la représentation."],["🥁 Des traditions qui se croisent","La documentation UNESCO évoque notamment des expressions amazighes et gnaouas, des musiques, des danses et des pratiques de rue. Elles n’appartiennent pas toutes à une même communauté et ne se résument pas au décor d’une place touristique."],["🏙️ Un patrimoine fragile","Développement immobilier, infrastructures et tourisme peuvent transformer les conditions dans lesquelles les artistes se produisent. Sauvegarder ce lieu suppose donc aussi de préserver la possibilité pour ses praticiens de travailler, de transmettre et de renouveler leurs arts."]],"key":"Ce qui est inscrit, c’est l’espace culturel vivant et ses pratiques, pas seulement la place comme monument.","observe":"Regarde la place au crépuscule et repère la réunion autour des musiciens : l’image en donne une impression, pas un inventaire exhaustif.","words":["Conte","Espace public","Transmission"]},"kenya":{"year":"2014 · sauvegarde urgente","place":"Communautés Isukha et Idakho, ouest du Kenya","lead":"L’isukuti unit la vitesse des percussions, la danse, le chant et les grands événements qui marquent la vie collective.","sections":[["🥁 Trois tambours, plusieurs voix","L’ensemble central comprend généralement trois tambours : grand, moyen et petit. Un corne et des hochets métalliques peuvent compléter l’accompagnement. Un soliste guide les chants pendant que danseurs et percussionnistes se répondent."],["🎉 Une danse des moments importants","L’isukuti se rencontre lors de rassemblements très divers : naissances, initiations, mariages, funérailles, événements religieux, sportifs ou communautaires. Il n’existe donc pas une seule occasion « correcte » de la pratiquer."],["👥 Apprendre en participant","La pratique relie chant, mouvement et relations sociales. Les compétences se transmettent entre générations et dépendent de personnes capables de composer, de fabriquer les instruments et d’enseigner les rythmes."],["🛡️ Pourquoi une sauvegarde urgente ?","Lors de son inscription en 2014, l’UNESCO soulignait un affaiblissement de la transmission, le vieillissement de certains porteurs et le coût des matériaux. La « sauvegarde urgente » n’affirme pas que la danse a disparu : elle signale le besoin d’aider les communautés à la faire vivre."]],"key":"Le nom isukuti désigne aussi les tambours caractéristiques de cette danse.","observe":"Sur l’illustration, cherche les tambours et les interactions entre musiciens et danseurs.","words":["Trois tambours","Fêtes","Sauvegarde"]},"mexique":{"year":"2010","place":"Mexique, avec un éclairage sur le Michoacán","lead":"Le patrimoine culinaire commence dans les champs et se poursuit jusque dans les gestes de la cuisine et les fêtes.","sections":[["🌽 La base de nombreux repas","Maïs, haricots et piment tiennent une place centrale dans les savoirs étudiés par l’UNESCO. Mais la cuisine traditionnelle mexicaine ne se résume pas à trois ingrédients : elle intègre de nombreuses plantes, outils, recettes et habitudes locales."],["🌱 Des champs à l’assiette","La milpa associe traditionnellement diverses cultures ; les chinampas constituent un autre système agricole, adapté à des zones lacustres. Ces modèles rappellent que la nourriture commence avec l’organisation de la terre et le travail agricole."],["🪨 La nixtamalisation","Le maïs peut être traité dans une solution alcaline, souvent avec de la chaux, avant d’être rincé et moulu. Cette technique modifie la matière et améliore notamment la disponibilité de certains nutriments. La pâte obtenue sert à des préparations comme les tortillas et les tamales."],["🕯️ Manger, célébrer, transmettre","Les repas portent aussi des significations lors d’événements familiaux ou rituels, notamment le Jour des morts. Le dossier UNESCO met en valeur les communautés de cuisinières et les savoir-faire du Michoacán comme exemples d’une culture partagée bien plus vaste."]],"key":"La cuisine classée comprend l’agriculture, les techniques, les rites et le partage, pas une liste de plats à collectionner.","observe":"Dans l’image, vois la pâte de maïs et la meule : elles rappellent le travail qui précède la tortilla.","words":["Maïs","Nixtamalisation","Milpa"]},"bresil":{"year":"2014","place":"Communautés de capoeira au Brésil","lead":"Dans le cercle de capoeira, le mouvement devient dialogue : chaque geste dépend du rythme, de l’autre joueur et du groupe autour.","sections":[["🔄 Qu’est-ce qu’une roda ?","La « roda » est le cercle formé par les participants. Deux joueurs évoluent au centre, tandis que les autres chantent, frappent dans leurs mains et jouent des instruments. La capoeira associe ainsi des dimensions de lutte, de danse et de musique."],["🎵 Le rythme guide la rencontre","Le maître peut jouer du berimbau, instrument à une corde, et conduire les chants. Les interactions entre les joueurs ne sont pas une chorégraphie entièrement fixée : elles demandent attention, imagination et maîtrise du code partagé."],["👣 Apprendre à regarder","La transmission se fait largement en observant, imitant et pratiquant avec les autres. Les membres apprennent les mouvements, les instruments, les chants, mais aussi les règles de respect et la conduite du jeu."],["✊ Une mémoire de résistance","L’UNESCO souligne la place de la capoeira dans la mémoire des résistances à l’oppression historique. La roda réunit des personnes de différents horizons et rappelle qu’une activité corporelle peut être également une école de relations et d’histoire."]],"key":"La roda est un cercle vivant d’interactions ; elle ne se réduit pas à un duel spectaculaire.","observe":"Regarde les personnes qui forment le cercle : elles participent à la capoeira autant que les deux joueurs au centre.","words":["Roda","Berimbau","Mémoire"]},"perou":{"year":"2013","place":"Au-dessus de l’Apurímac, Andes péruviennes","lead":"Chaque année, des communautés quechuas réinventent un pont ancien en refaisant, ensemble, presque chaque fibre de son passage.","sections":[["🌾 De l’herbe à la corde","Des familles préparent des fibres végétales andines, les tordent en cordelettes puis les assemblent pour obtenir de longues cordes. Des spécialistes accompagnent la fabrication de grands câbles et le tissage du tablier du pont."],["🌉 Trois jours décisifs","Selon le dossier UNESCO, la rénovation collective dure traditionnellement trois jours. Les grosses cordes sont fixées à d’anciens ancrages de pierre ; des bâtisseurs tissent à partir des deux extrémités. Une fête réunit ensuite les participants."],["🤝 Quatre communautés","Les communautés de Huinchiri, Chaupibanda, Choccayhua et Ccollana Quehue sont associées à la rénovation. Ce chantier entretient leurs relations tout au long de l’année et permet de transmettre des gestes en famille."],["🙏 Une dimension symbolique","Le pont est plus qu’un équipement permettant de franchir la rivière : il constitue aussi une expression des liens avec le milieu naturel, l’histoire locale et les générations précédentes. Les cérémonies et les responsabilités collectives comptent autant que le résultat matériel."]],"key":"Ce qui est inscrit sur la liste UNESCO, c’est le renouvellement collectif et ses savoir-faire, autant que le pont lui-même.","observe":"Observe les fibres et la structure suspendue : l’image évoque la difficulté de tisser un passage au-dessus d’une gorge.","words":["Fibres végétales","Travail collectif","Andes"]}};

<section class="hero"><div class="hero-left"><span class="eyebrow">✦ Une aventure à travers le patrimoine vivant</span><h1>Le monde est<br><em>un grand livre.</em></h1><p>Pars à la rencontre de traditions, de saveurs, de musiques et de savoir-faire. À chaque escale : une fiche illustrée à lire, trois énigmes et un tampon dans ton passeport.</p><div class="herobuttons"><button class="btn prime" data-action="read" data-id="${STOPS.find(s=>!state.completed[s.id])?.id||STOPS[0].id}">🧭 Commencer l’exploration</button><button class="btn outline" data-action="challenge">⚡ Défi éclair</button><button class="btn outline" data-action="recipes">🍽️ Recettes du monde</button><button class="btn outline" data-action="travel">🗺️ Voyages et rencontres</button></div></div><div class="hero-art" aria-hidden="true"><div class="orbit"></div><div class="globe">🌍</div><span class="orb one">🇯🇵</span><span class="orb two">🇲🇽</span><span class="orb three">🇻🇺</span><span class="orb four">🇰🇪</span></div></section>

nir</h3><p>${esc(g.key)}</p></div><div class="aside-sheet"><h3>📷 Observer la photographie</h3><p>${esc(TRAVEL_PHOTOS[s.id].caption)}</p><p>Quels gestes, objets ou relations y repères-tu ? La légende et la date situent cette scène.</p></div><div class="aside-sheet"><h3>🧭 Trois mots pour te repérer</h3><div class="pillset">${g.words.map(w=>`<span>${esc(w)}</span>`).join('')}</div><p style="margin-top:14px">${esc(s.fact)}</p></div><div class="aside-sheet"><h3>💬 À garder en tête</h3><p>Cette escale traite d’une tradition située : les pratiques évoluent, et aucune tradition ne représente à elle seule toute la culture d’un pays.</p></div></aside></div>`}

function startTour(id){const s=STOPS.find(s=>s.id===id);if(!s)return;view='home';game={kind:'tour',stop:s,questions:s.q.map((_,i)=>({s,i})),idx:0,answer:null,score:0};render();window.scrollTo({top:0,behavior:'smooth'})}
function startChallenge(){const a=STOPS.flatMap(s=>s.q.map((_,i)=>({s,i})));for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}view='challenge';game={kind:'challenge',questions:a.slice(0,5),idx:0,answer:null,score:0};render();window.scrollTo({top:0,behavior:'smooth'})}
function renderGame(){if(game.idx>=game.questions.length){renderEnd();return;}const entry=game.questions[game.idx],s=entry.s,q=s.q[entry.i],answered=game.answer!==null,good=answered&&game.answer===q[2];let pct=Math.round((game.idx/game.questions.length)*100);let isTour=game.kind==='tour';app.innerHTML=`<button class="back" data-action="${isTour?'home':'challenge'}">← ${isTour?'Retour aux escales':'Retour au défi'}</button><section class="tour-hero" style="--artA:${s.colors[0]};--artB:${s.colors[1]}"><div class="tour-art">${s.icon}</div><div><div class="eyebrow">${isTour?'Escale culturelle':'Défi éclair · destination surprise'}</div><h1>${esc(s.country)}</h1><p>${esc(s.topic)} · ${esc(s.type)}</p></div><span class="tourflag">${s.flag}</span></section>

<aside class="factbox"><img src="${IMAGES[s.id]}" alt="Illustration de ${esc(s.topic)}" style="width:100%;border-radius:13px;aspect-ratio:3/2;object-fit:cover;margin-bottom:12px"><div class="icon">${isTour?'📖':'🧭'}</div><h3>${isTour?'Le carnet de terrain':'Un indice de voyage'}</h3><p>${esc(isTour?s.fact:s.intro)}</p><div class="factmeta">${isTour?'PATRIMOINE VIVANT · UNESCO':'UNE TRADITION, UNE HISTOIRE'}<br>${esc(s.region)}</div><div class="fiche-teaser"><p>Tu veux connaître l’histoire complète, les gestes et les symboles de cette tradition ?</p><button data-action="read" data-id="${s.id}">📖 Lire la fiche enrichie</button></div></aside></div>`}
function answer(i){if(!game||game.answer!==null||game.idx>=game.questions.length)return;let e=game.questions[game.idx],q=e.s.q[e.i];if(i<0||i>=q[1].length)return;game.answer=i;state.seen[qid(e.s,e.i)]=true;if(i===q[2]){game.score++;if(!state.solved[qid(e.s,e.i)]){state.solved[qid(e.s,e.i)]=true;flash('✨ +10 XP · Nouvelle connaissance !')}}persist();render()}
function next(){if(!game||game.answer===null)return;game.idx++;game.answer=null;if(game.idx>=game.questions.length&&game.kind==='tour'){state.completed[game.stop.id]=true;state.best[game.stop.id]=Math.max(state.best[game.stop.id]||0,game.score);persist()}render()}
function renderEnd(){const tour=game.kind==='tour',s=game.stop,score=game.score,total=game.questions.length;app.innerHTML=`<section class="sheet finish"><div class="sealemblem">${tour?s.icon:'🏆'}</div><div class="eyebrow" style="color:#a47442;margin-top:18px">${tour?'Un nouveau tampon pour ton passeport':'Défi éclair accompli'}</div><h2>${tour?esc(s.country)+' exploré !':'Bravo, explorateur !'}</h2><p>${tour?`Tu as découvert ${esc(s.topic)} et ajouté cette escale à ton carnet. Ce patrimoine vivant recèle encore bien d’autres histoires.`:'Tu viens de traverser cinq énigmes culturelles, des gestes quotidiens aux traditions transmises de génération en génération.'}</p><div class="passport-stats" style="max-width:430px;margin:12px auto 24px"><div class="passport-stat"><strong>${score}/${total}</strong><span>réponses justes</span></div><div class="passport-stat"><strong>${xp()}</strong><span>XP cumulés</span></div><div class="passport-stat"><strong>${countDone()}</strong><span>tampons</span></div></div><div class="buttons"><button class="btn prime" data-action="${tour?'home':'redo-challenge'}">${tour?'🧭 Poursuivre le voyage':'⚡ Rejouer'}</button><button class="btn ghost" data-action="passport">🛂 Voir mon passeport</button>${tour?`<button class="btn ghost" data-action="start" data-id="${s.id}">↻ Revoir l’escale</button><button class="btn ghost" data-action="read" data-id="${s.id}">📖 Relire la fiche</button>`:''}</div></section>`}
function renderChallengeHome(){app.innerHTML=`<section class="daily"><div class="eyebrow">⚡ Jeu rapide</div><h1>Le défi des cinq escales</h1><p>Cinq questions piochées dans l’atlas, cinq pays à traverser. Tu peux tomber sur des lieux encore inconnus et apprendre quelque chose même en te trompant.</p><div class="challenge-info"><span>🎲 Tirage aléatoire</span><span>🧠 5 énigmes</span><span>⏳ Aucune limite de temps</span></div><div class="actions-row"><button class="btn prime" data-action="redo-challenge">Lancer le défi →</button></div></section><div class="sectionhead"><div><h2>Apprendre, pas seulement gagner</h2><p>Chaque correction explique la bonne réponse et propose la source à consulter.</p></div></div><div class="library"><article class="library-card"><div style="font-size:2rem">🌟</div><h3>Un score sans pression</h3><p>Tu peux essayer autant de fois que tu veux : seules les nouvelles bonnes réponses donnent des points supplémentaires.</p></article><article class="library-card"><div style="font-size:2rem">🛂</div><h3>Ton passeport reste à jour</h3><p>Les escales complètes restent enregistrées sur cet appareil. À tout moment, tu peux revenir au carnet de voyage.</p></article></div>`}
function renderPassport(){let done=countDone(), title=done===13?'Grand explorateur du patrimoine':done>=8?'Passeport des horizons':done>=4?'Curieux des cultures':'Apprenti explorateur';app.innerHTML=`<section class="passport-hero"><div class="passport-symbol">🛂</div><div><div class="eyebrow">Ton carnet personnel</div><h1>Passeport des cultures</h1><p>${title} · Les savoirs rencontrés sont tes plus beaux souvenirs.</p></div></section><div class="passport-stats"><div class="passport-stat"><strong>${done}/13</strong><span>tampons collectionnés</span></div><div class="passport-stat"><strong>${xp()}</strong><span>points de savoir</span></div><div class="passport-stat"><strong>${Object.keys(state.seen).length}/39</strong><span>questions découvertes</span></div></div><div class="sectionhead"><div><h2>La collection de tampons</h2><p>Chaque escale terminée rejoint ton carnet.</p></div></div><div class="stamps">${STOPS.map(s=>`<article class="stamp ${state.completed[s.id]?'':'locked'}"><div class="si">${state.completed[s.id]?s.icon:'🔒'}</div><b>${esc(s.country)}</b><small>${state.completed[s.id]?'✓ '+esc(s.topic):'À découvrir'}</small><button data-action="start" data-id="${s.id}">${state.completed[s.id]?'Revisiter':'Partir explorer'}</button></article>`).join('')}</div><div class="actions-row"><button class="btn ghost" data-action="home">← Revenir à l’atlas</button><button class="btn ghost" data-action="reset">Effacer ma progression</button></div>`}
function renderLibrary(){const count=Object.keys(state.read).length;app.innerHTML=`<div class="sectionhead"><div><div class="eyebrow" style="color:var(--aqua)">📚 La bibliothèque de l’explorateur</div><h2>Des histoires à parcourir</h2><p>${count}/13 fiches découvertes · Des chapitres documentés, des photographies et les sources à consulter.</p></div></div><section class="library">${STOPS.map(s=>`<article class="library-card"><img class="lib-cover" loading="lazy" src="${TRAVEL_PHOTOS[s.id].local}" alt="${esc(TRAVEL_PHOTOS[s.id].caption)}"><div class="lib-copy">${travelCredit(s.id)}<div class="desttop"><span>${s.flag} ${esc(s.country)}</span><span>${state.read[s.id]?'✓ Lu':'À découvrir'}</span></div><h3>${esc(s.topic)}</h3><div class="desttopic">${esc(s.type)}</div><p>${esc(GUIDES[s.id].lead)}</p><div class="actions-row"><button class="btn prime" data-action="read" data-id="${s.id}">📖 Lire la fiche →</button><button class="btn ghost" data-action="start" data-id="${s.id}">🧩 Quiz</button>${recipeLink(s.id)}</div></div></article>`).join('')}</section><div class="infofoot">Photographies documentaires légendées et créditées, choisies sur Wikimedia Commons. Les informations culturelles proviennent des notices UNESCO citées. Photos, cartes, récits et textes sont disponibles hors connexion après mise à jour complète ; les vidéos officielles demandent Internet.</div>`}
function reset(){const ok=confirm('Effacer tous tes tampons, les réponses explorées et les points gagnés sur cet appareil ?');if(!ok)return;state={completed:{},seen:{},solved:{},best:{},read:{},recipeFavorites:state.recipeFavorites,recipeKitchen:state.recipeKitchen,journeys:state.journeys};persist();show('passport');flash('Ton passeport est prêt pour un nouveau départ.')}
document.addEventListener('click',ev=>{let b=ev.target.closest('[data-action]');if(!b)return;let a=b.dataset.action;if(a==='home'||a==='passport'||a==='challenge'||a==='library'||a==='recipes'||a==='travel')show(a==='home'?'home':a);else if(a==='start')startTour(b.dataset.id);else if(a==='recipe')openRecipe(b.dataset.id);else if(a==='back-recipe')closeRecipe();else if(a==='print-recipe')printRecipe();else if(a==='read')openDetail(b.dataset.id);else if(a==='back-detail')closeDetail();else if(a==='filter'){filter=b.dataset.filter;render()}else if(a==='answer')answer(Number(b.dataset.index));else if(a==='next')next();else if(a==='redo-challenge')startChallenge();else if(a==='reset')reset()});

/* Atlas des cultures v3 : installation PWA, sauvegardes et mises à jour. */
const APP_VERSION='4.4.0';
const BACKUP_FORMAT='atlas-des-cultures/progression-v1';
const ALERTS_KEY='atlas-cultures-system-update-alerts';

const saveSetting=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};

let deferredInstallPrompt=null, swRegistration=null, availableUpdateVersion=null;

 app.innerHTML=`<header class="settings-hero"><img src="./icons/atlas-icon.svg" alt="Icône du jeu"><div><span class="badge-ver">Version ${APP_VERSION}</span><h1>Ton atlas, partout avec toi</h1><p>Installation, nouveautés et sauvegardes de ton passeport culturel.</p></div></header>
 <div class="settings-grid">
 <section class="settings-card"><h2>📲 Installer sur ton téléphone</h2><p>Sur Android, installe l’atlas comme une application indépendante : une icône sur l’écran d’accueil, un lancement plein écran et des fiches accessibles sans réseau.</p><div class="settings-hint">${installStatus}</div><div class="actions-row"><button class="btn prime" data-action="install">📲 Installer l’application</button></div><p>Le jeu doit être publié sur une adresse HTTPS (par exemple GitHub Pages). Un fichier HTML ouvert depuis « Téléchargements » ne suffit pas à installer une PWA.</p></section>

 <section class="settings-card"><h2>💾 Sauvegarde JSON</h2><p>Garde une copie de ta progression pour changer de téléphone, de navigateur ou de site sans perdre tes tampons.</p><div class="settings-stats"><span>🛂 ${countDone()} escales</span><span>✨ ${xp()} XP</span><span>📖 ${Object.keys(state.read).length} fiches lues</span></div><div class="actions-row"><button class="btn prime" data-action="export-json">⬇ Exporter ma progression</button><button class="btn ghost" data-action="import-json">⬆ Importer un fichier JSON</button></div><div class="settings-hint">Une restauration fusionne les avancées du fichier avec celles de cet appareil, sans effacer les progrès déjà acquis.</div></section>

function downloadBlob(content,mime,name){
 const blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),5000);
}
function exportJSON(){
 const data={format:BACKUP_FORMAT,exportedAt:new Date().toISOString(),appVersion:APP_VERSION,progress:{completed:state.completed,seen:state.seen,solved:state.solved,best:state.best,read:state.read,recipeFavorites:state.recipeFavorites,recipeKitchen:state.recipeKitchen,journeys:state.journeys}};
 downloadBlob(JSON.stringify(data,null,2),'application/json;charset=utf-8','atlas-des-cultures-progression.json');
 flash('💾 Ton passeport JSON a été exporté !');
}
function cleanBackupProgress(obj){
 if(!obj || typeof obj!=='object' || Array.isArray(obj))throw Error('Le JSON ne contient pas de progression valide.');
 const output={completed:{},seen:{},solved:{},best:{},read:{},recipeFavorites:cleanRecipeFavorites(obj.recipeFavorites),recipeKitchen:cleanRecipeKitchen(obj.recipeKitchen),journeys:cleanJourneys(obj.journeys)};
 const ids=new Set(STOPS.map(s=>s.id)),questions=new Set(STOPS.flatMap(s=>s.q.map((_,i)=>qid(s,i))));
 for(const key of ['completed','read'])if(obj[key] && typeof obj[key]==='object'){
  for(const [id,v] of Object.entries(obj[key]))if(ids.has(id)&&v===true)output[key][id]=true;
 }
 for(const key of ['seen','solved'])if(obj[key] && typeof obj[key]==='object'){
  for(const [id,v] of Object.entries(obj[key]))if(questions.has(id)&&v===true)output[key][id]=true;
 }
 if(obj.best&&typeof obj.best==='object')for(const [id,v] of Object.entries(obj.best)){
  if(ids.has(id)&&Number.isInteger(v)&&v>=0&&v<=3)output.best[id]=v;
 }
 return output;
}
async function importJSON(file){
 if(!file)return;
 try{
  if(file.size>1024*1024)throw Error('Fichier trop volumineux.');
  const raw=JSON.parse(await file.text());
  if(raw.format && raw.format!==BACKUP_FORMAT)throw Error('Ce format JSON ne correspond pas au passeport Atlas des cultures.');
  const newProgress=cleanBackupProgress(raw.progress??raw);
  // Fusion : aucun progrès existant n’est perdu.
  for(const key of ['completed','read','seen','solved','recipeFavorites'])state[key]={...state[key],...newProgress[key]};
  state.recipeKitchen={...newProgress.recipeKitchen,...state.recipeKitchen};
  state.journeys=mergeJourneys(state.journeys,newProgress.journeys);
  for(const [id,v] of Object.entries(newProgress.best))state.best[id]=Math.max(state.best[id]||0,v);
  persist();render();flash('✅ Progression restaurée depuis le fichier JSON !');
 }catch(e){alert('Impossible d’importer le passeport : '+(e?.message||'fichier invalide'));}
}

 <text x="82" y="318" font-size="28" font-family="Georgia,serif" fill="#153843">${done} / ${STOPS.length} escales</text>
 <text x="480" y="318" font-size="28" font-family="Georgia,serif" fill="#153843">${xp()} points de savoir</text>
 ${item}
 <path d="M84 1150H916" stroke="#d5d0bc" stroke-width="2"/>
 <text x="500" y="1182" text-anchor="middle" font-family="Georgia,serif" font-size="19" fill="#678078">Un monde de savoirs, un voyage qui continue.</text>
 </svg>`;
 downloadBlob(svgDoc,'image/svg+xml;charset=utf-8','atlas-des-cultures-passeport.svg');flash('🎨 Ton passeport SVG est prêt !');

async function installApp(){
 if(isStandalone()){flash('✅ Atlas des cultures est déjà installé.');return;}
 if(deferredInstallPrompt){
  const prompt=deferredInstallPrompt;deferredInstallPrompt=null;
  await prompt.prompt();
  try { await prompt.userChoice; }catch{}
  refreshInstallButton();
  return;
 }
 alert('Pour installer Atlas des cultures sur Android : ouvre son adresse HTTPS avec Chrome, appuie sur le menu ⋮, puis choisis « Installer l’application » ou « Ajouter à l’écran d’accueil ». Depuis un fichier local, cette option ne peut pas fonctionner.');
}
function showUpdateBanner(ver){
 const banner=document.getElementById('pwa-update-banner');
 availableUpdateVersion=ver||availableUpdateVersion||'nouvelle version';
 document.getElementById('pwa-update-label').textContent='Version '+availableUpdateVersion+' disponible · ton passeport est conservé.';
 if(banner.dataset.snoozed!==availableUpdateVersion)banner.classList.add('visible');
 if(stored(ALERTS_KEY)==='yes' && stored(NOTIFIED_KEY)!==availableUpdateVersion && 'Notification' in window && Notification.permission==='granted'){
   saveSetting(NOTIFIED_KEY,availableUpdateVersion);
   swRegistration?.showNotification('🌍 Atlas des cultures : mise à jour disponible',{body:'Version '+availableUpdateVersion+' · ouvre le jeu pour l’installer.',icon:'./icons/atlas-192.png',tag:'atlas-update-'+availableUpdateVersion}).catch(()=>{});
 }
}
async function checkUpdates(userRequested=false){
 if(!('serviceWorker' in navigator)||!(location.protocol==='https:'||['localhost','127.0.0.1'].includes(location.hostname))){
  if(userRequested)flash('📲 Publie le jeu sur HTTPS pour activer les mises à jour.');return;
 }
 try{
  swRegistration=swRegistration||await navigator.serviceWorker.getRegistration('./');
  if(swRegistration)await swRegistration.update();
  const response=await fetch('./version.json?check='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw Error('Impossible de lire la version en ligne');
  const info=await response.json();
  if(info.version && info.version!==APP_VERSION){
    showUpdateBanner(info.version);return;
  }
  if(swRegistration?.waiting){showUpdateBanner(info.version||'disponible');return;}
  if(userRequested)flash('✅ Tu utilises la dernière version : '+APP_VERSION);
 }catch(e){if(userRequested)flash('📡 Vérification impossible hors connexion.');}
}
async function applyUpdate(){
 if(pwaUpdating)return;
 pwaUpdating=true;
 try{
  if(game && !confirm('Une nouvelle version est disponible. Ta progression est sauvegardée, mais ton quiz en cours repartira du début. Mettre à jour maintenant ?')){pwaUpdating=false;return;}
  swRegistration=swRegistration||await navigator.serviceWorker.getRegistration('./');
  if(swRegistration?.waiting){
   document.getElementById('pwa-update-button').textContent='Installation…';
   swRegistration.waiting.postMessage({type:'SKIP_WAITING'});
  }else{
   await swRegistration?.update();
   if(swRegistration?.waiting){swRegistration.waiting.postMessage({type:'SKIP_WAITING'});}
   else{flash('🔄 Mise à jour en préparation. Reviens dans quelques instants.');pwaUpdating=false;}
  }
 }catch{flash('Impossible d’installer la mise à jour pour le moment.');pwaUpdating=false;}
}
async function toggleSystemAlerts(){
 const enabled=stored(ALERTS_KEY)==='yes';
 if(enabled){saveSetting(ALERTS_KEY,'no');render();flash('🔕 Notifications système désactivées.');return;}
 if(!('Notification' in window)||!swRegistration){flash('Ce navigateur ne prend pas en charge ces notifications.');return;}
 try{
  const perm=await Notification.requestPermission();
  if(perm!=='granted'){flash('Les notifications système ne sont pas autorisées.');return;}
  saveSetting(ALERTS_KEY,'yes');render();flash('🔔 Alertes activées lorsque l’application est ouverte.');
 }catch{flash('Impossible d’activer les notifications.');}
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;refreshInstallButton();});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;refreshInstallButton();flash('🌍 Atlas des cultures est installé !');});
if('serviceWorker' in navigator && (location.protocol==='https:' || ['localhost','127.0.0.1'].includes(location.hostname))){
 window.addEventListener('load',async()=>{
  try{
   swRegistration=await navigator.serviceWorker.register('./sw.js',{scope:'./'});
   swRegistration.addEventListener('updatefound',()=>{
     const worker=swRegistration.installing;
     worker?.addEventListener('statechange',()=>{
       if(worker.state==='installed' && navigator.serviceWorker.controller)showUpdateBanner(availableUpdateVersion||'disponible');
     });
   });
   if(swRegistration.waiting && navigator.serviceWorker.controller)showUpdateBanner(availableUpdateVersion||'disponible');
   await checkUpdates(false);
  }catch(err){console.warn('PWA non disponible :',err);}
 });
 navigator.serviceWorker.addEventListener('controllerchange',()=>{
  if(pwaReloading)return;
  if(pwaUpdating){pwaReloading=true;window.location.reload();}
 });
 window.setInterval(()=>{if(navigator.onLine)checkUpdates(false);},30*60*1000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&navigator.onLine)checkUpdates(false);});
 window.addEventListener('online',()=>checkUpdates(false));
}
document.getElementById('pwa-update-button').addEventListener('click',applyUpdate);
document.getElementById('pwa-update-later').addEventListener('click',()=>{
  const banner=document.getElementById('pwa-update-banner');
  banner.dataset.snoozed=availableUpdateVersion||'disponible';banner.classList.remove('visible');
});
document.getElementById('pwa-import').addEventListener('change',async(e)=>{
 await importJSON(e.target.files?.[0]);e.target.value='';
});
document.addEventListener('click',event=>{
 const button=event.target.closest('[data-action]');if(!button)return;
 const action=button.dataset.action;
 if(action==='settings'){show('settings');refreshInstallButton();}
 else if(action==='install')installApp();
 else if(action==='export-json')exportJSON();
 else if(action==='import-json')document.getElementById('pwa-import').click();
 else if(action==='export-svg')exportPassportSVG();
 else if(action==='check-updates')checkUpdates(true);
 else if(action==='enable-alerts')toggleSystemAlerts();
});
refreshInstallButton();

render();
</script>
